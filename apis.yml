name: Relatable.io
description: Relatable is a Product Relationship Management (PRM) platform for the medical technology
  and medical device industry, based in Nashville, Tennessee and backed by Techstars. Its Product Data
  Catalog centralizes competitive product intelligence, its Guided Purchase Solution turns that data into
  commercial insight, and 3rd-party data integrations sync external sources such as pricing intelligence.
  The platform serves contracting (RFP responses), sales (business reviews), marketing (competitive
  intelligence management), and technical support (product lookups). As of this enrichment pass Relatable
  publishes no public developer API, OpenAPI, docs portal, or SDKs.
